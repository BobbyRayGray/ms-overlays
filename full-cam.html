<script>
// Scale the 1920x1080 stage to whatever size the app gives the page
(function(){
  var st = document.getElementById('stage');
  function fit(){ var s = Math.min(innerWidth/1920, innerHeight/1080) || 1;
    st.style.webkitTransform = st.style.transform = 'scale(' + s + ')';
    st.style.left = ((innerWidth - 1920*s)/2) + 'px'; st.style.top = ((innerHeight - 1080*s)/2) + 'px'; }

var Q = new URLSearchParams(location.search);

</script>
